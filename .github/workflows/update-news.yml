name: 每日财经新闻更新

on:
  schedule:
    # 每天北京时间早上7点、中午12点、晚上7点各更新一次
    - cron: '0 23 * * *'   # 北京时间 7:00
    - cron: '0 4 * * *'    # 北京时间 12:00
    - cron: '0 11 * * *'   # 北京时间 19:00
  workflow_dispatch:        # 支持手动触发

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取财经新闻
        run: |
          node .github/scripts/fetch-news.js

      - name: 提交并推送更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "更新财经新闻 - $(date '+%Y/%m/%d %H:%M')" && git push)

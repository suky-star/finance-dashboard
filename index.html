                    <span class="text-[10px] text-muted-foreground">按跌幅排序</span>
                  </div>
                  <div class="space-y-2.5">
                    ${aShare.topLosers.map((s, i) => `
                      <div class="flex items-center gap-3">
                        <span class="w-5 text-xs font-bold text-fall text-center">${i + 1}</span>
                        <div class="flex-1 min-w-0">
                          <div class="text-sm font-medium text-foreground">${esc(s.name)}</div>
                          <div class="text-[10px] text-muted-foreground">主力流出 ${s.netOutflow}亿</div>
                        </div>
                        <div class="text-right">
                          <div class="text-sm font-bold font-din text-fall">${s.change}%</div>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>
                
                <!-- 资金流向 -->
                <div class="bg-card rounded-xl p-4 shadow-soft">
                  <div class="flex items-center justify-between mb-3">
                    <h3 class="text-sm font-bold text-foreground">主力资金流向</h3>
                    <span class="text-[10px] text-muted-foreground">净流入TOP5</span>
                  </div>
                  <div class="space-y-2.5">
                    ${aShare.topInflow.map((s, i) => {
                      const pct = (s.netInflow / aShare.topInflow[0].netInflow * 100).toFixed(0);
                      return `
                        <div>
                          <div class="flex items-center justify-between mb-1">
                            <span class="text-xs text-foreground">${esc(s.name)}</span>
                            <span class="text-xs font-din text-rise">+${s.netInflow}亿</span>
                          </div>
                          <div class="h-1.5 bg-accent rounded-full overflow-hidden">
                            <div class="h-full bg-rise rounded-full" style="width:${pct}%"></div>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
                
                <!-- 后续趋势解读 -->
                <div class="bg-card rounded-xl p-4 shadow-soft">
                  <div class="flex items-center gap-2 mb-3">
                    <div class="w-6 h-6 rounded-lg bg-hot/15 flex items-center justify-center text-hot">${icon('trending-up', 'w-3.5 h-3.5')}</div>
                    <span class="text-sm font-bold text-foreground">后续趋势解读</span>
                  </div>
                  <div class="space-y-2">
                    ${aShare.trendOutlook.map(t => `
                      <div class="flex items-start gap-2">
                        <span class="text-hot text-xs mt-0.5 font-bold">•</span>
                        <span class="text-[11px] text-foreground leading-relaxed">${esc(t)}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
                ` : `
                <div class="bg-card rounded-xl p-8 text-center">
                  <div class="text-muted-foreground text-sm">暂无A股收盘数据</div>
                </div>
                `}
              ` : `
                <!-- 美股收盘总结 -->
                ${us ? `
                <!-- 三大指数 -->
                <div class="bg-card rounded-xl p-4 shadow-soft">
                  <div class="flex items-center gap-2 mb-3">
                    <span class="text-xs font-bold ${us.marketSentiment === '偏强' ? 'text-rise' : 'text-muted-foreground'}">${us.marketSentiment}</span>
                    <span class="text-[10px] text-muted-foreground ml-auto">美股收盘</span>
                  </div>
                  <div class="grid grid-cols-3 gap-3">
                    ${us.indices.map(idx => {
                      const rise = parseFloat(idx.change) >= 0;
                      return `
                        <div class="text-center">
                          <div class="text-[11px] text-muted-foreground mb-1">${esc(idx.name)}</div>
                          <div class="text-base font-bold font-din ${rise ? 'text-rise' : 'text-fall'}">${idx.level?.toFixed(0) || '--'}</div>
                          <div class="text-[11px] font-din ${rise ? 'text-rise' : 'text-fall'}">${rise ? '+' : ''}${idx.change}%</div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
                
                <!-- AI分析总结 -->
                <div class="bg-card rounded-xl p-4 shadow-soft">
                  <div class="flex items-center gap-2 mb-2">
                    <div class="w-6 h-6 rounded-lg bg-primary/15 flex items-center justify-center text-primary">${icon('zap', 'w-3.5 h-3.5')}</div>
                    <span class="text-sm font-bold text-foreground">AI 收盘分析</span>
                  </div>
                  <p class="text-[12px] text-foreground leading-relaxed">${esc(us.summary)}</p>
                </div>
                
                <!-- 热门板块 -->
                <div class="bg-card rounded-xl p-4 shadow-soft">
                  <div class="flex items-center justify-between mb-3">
                    <h3 class="text-sm font-bold text-foreground">热门板块表现</h3>
                    <span class="text-[10px] text-muted-foreground">按涨跌幅</span>
                  </div>
                  <div class="space-y-2.5">
                    ${[...us.sectors].sort((a, b) => parseFloat(b.change) - parseFloat(a.change)).map((s, i) => {
                      const rise = parseFloat(s.change) >= 0;
                      return `
                        <div class="flex items-center gap-3">
                          <span class="w-5 text-xs font-bold ${rise ? 'text-rise' : 'text-fall'} text-center">${i + 1}</span>
                          <div class="flex-1 min-w-0">
                            <div class="text-sm font-medium text-foreground">${esc(s.name)}</div>
                          </div>
                          <div class="text-right">
                            <div class="text-sm font-bold font-din ${rise ? 'text-rise' : 'text-fall'}">${rise ? '+' : ''}${s.change}%</div>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
                ` : `
                <div class="bg-card rounded-xl p-8 text-center">
                  <div class="text-muted-foreground text-sm">暂无美股收盘数据</div>
                </div>
                `}
              `}
            </div>
          </div>
        </div>
      `;
    }

    function renderNewsPage() {
      const newsData = state.dynamicData;
      const newsList = newsData?.news || [];
      const flashList = newsData?.flash || [];
      
      const newsTabActive = state.newsTab === 'news';
      
      return `
        <div class="page ${state.activeTab === 'news' ? 'active' : ''}" id="page-news">
          <div class="min-h-screen bg-background safe-bottom">
            <div class="mx-auto max-w-md px-4 py-4 flex flex-col gap-4">
              <div class="flex items-center justify-between mb-1">
                <div class="flex items-center gap-2">
                  ${icon('newspaper', 'w-5 h-5 text-hot')}
                  <h1 class="text-xl font-bold text-foreground">财经资讯</h1>
                </div>
                <span class="text-xs text-muted-foreground">金十数据</span>
              </div>
              
              <div class="flex bg-accent rounded-lg p-0.5">
                <button onclick="setNewsTab('news')" class="flex-1 py-1.5 text-xs font-medium rounded-md transition-all ${newsTabActive ? 'bg-white text-foreground shadow-sm' : 'text-muted-foreground'}">深度资讯</button>
                <button onclick="setNewsTab('flash')" class="flex-1 py-1.5 text-xs font-medium rounded-md transition-all ${!newsTabActive ? 'bg-white text-foreground shadow-sm' : 'text-muted-foreground'}">实时快讯</button>
              </div>
              
              ${newsTabActive ? `
                <div class="space-y-3">
                  ${newsList.length > 0 ? newsList.map(item => {
                    const tagColor = item.aiTag === '利好' ? 'bg-rise/10 text-rise' : item.aiTag === '利空' ? 'bg-fall/10 text-fall' : 'bg-muted-foreground/10 text-muted-foreground';
                    return `
                    <div class="bg-card rounded-xl p-4 shadow-soft">
                      <div class="flex items-start gap-2 mb-2">
                        ${item.aiTag ? `<span class="flex-shrink-0 text-[10px] px-1.5 py-0.5 ${tagColor} rounded font-bold">${esc(item.aiTag)}</span>` : ''}
                        <h3 class="text-sm font-semibold text-foreground leading-snug flex-1">${esc(item.title)}</h3>
                      </div>
                      ${item.summary ? `<p class="text-[11px] text-muted-foreground leading-relaxed mb-3">${esc(item.summary)}</p>` : ''}
                      ${item.matchedTopics && item.matchedTopics.length > 0 ? `
                        <div class="flex flex-wrap gap-1 mb-3">
                          ${item.matchedTopics.map(t => `
                            <span class="text-[10px] px-1.5 py-0.5 bg-accent text-muted-foreground rounded">#${esc(t)}</span>
                          `).join('')}
                        </div>
                      ` : ''}
                      ${item.relatedStocks && item.relatedStocks.length > 0 ? `
                        <div class="mb-3">
                          <div class="text-[10px] text-muted-foreground mb-1.5">高度相关个股</div>
                          <div class="flex flex-wrap gap-1.5">
                            ${item.relatedStocks.map(s => {
                              const relColor = s.relevance === '极高' ? 'bg-rise/10 text-rise' : s.relevance === '高' ? 'bg-hot/10 text-hot' : 'bg-primary/10 text-primary';
                              return `
                                <div class="flex items-center gap-1 text-[10px] px-2 py-1 ${relColor} rounded-md">
                                  <span class="font-medium">${esc(s.name)}</span>
                                  <span class="opacity-60">· ${esc(s.code)}</span>
                                  <span class="opacity-80 ml-0.5">${esc(s.relevance)}</span>
                                </div>
                              `;
                            }).join('')}
                          </div>
                        </div>
                      ` : ''}
                      <div class="flex items-center gap-2">
                        <span class="text-xs text-muted-foreground">${esc(item.time || '')}</span>
                        ${item.url ? `<a href="${esc(item.url)}" target="_blank" class="text-xs text-primary ml-auto">查看原文 →</a>` : ''}
                      </div>
                    </div>
                  `}).join('') : `
                    <div class="bg-card rounded-xl p-8 text-center">
                      <div class="text-muted-foreground text-sm">暂无资讯数据</div>
                    </div>
                  `}
                </div>
              ` : `
                <div class="space-y-2">
                  ${flashList.length > 0 ? flashList.map(item => `
                    <div class="bg-card rounded-xl p-4 shadow-soft">
                      <div class="flex items-start gap-3">
                        <div class="flex-shrink-0 w-2 h-2 mt-1.5 rounded-full ${item.important ? 'bg-rise' : 'bg-border'}"></div>
                        <div class="flex-1 min-w-0">
                          <p class="text-sm text-foreground leading-relaxed">${esc(item.title || item.content || '')}</p>
                          <div class="text-[11px] text-muted-foreground mt-2">${esc(item.time || '')}</div>
                        </div>
                      </div>
                    </div>
                  `).join('') : `
                    <div class="bg-card rounded-xl p-8 text-center">
                      <div class="text-muted-foreground text-sm">暂无快讯数据</div>
                    </div>
                  `}
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function renderConceptsPage() {
      const concepts = state.dynamicData?.analysis?.concepts || [];
      // 只展示有A股龙头的概念，按热度排序
      const aShareConcepts = concepts.filter(c => c.leaders && c.leaders.some(l => l.region === 'cn'));
      const displayConcepts = aShareConcepts.length > 0 ? aShareConcepts : concepts;
      
      return `
        <div class="page ${state.activeTab === 'concepts' ? 'active' : ''}" id="page-concepts">
          <div class="min-h-screen bg-background safe-bottom">
            <div class="mx-auto max-w-md px-4 py-4 flex flex-col gap-4">
              <div class="flex items-center justify-between mb-1">
                <div class="flex items-center gap-2">
                  ${icon('lightbulb', 'w-5 h-5 text-hot')}
                  <h1 class="text-xl font-bold text-foreground">热门概念</h1>
                </div>
                <span class="text-xs text-muted-foreground">${displayConcepts.length}个板块 · 按热度排序</span>
              </div>
              ${displayConcepts.length > 0 ? `
              <div class="space-y-3">
                ${displayConcepts.map(c => {
                  const isUp = c.trend === 'up';
                  const cnLeaders = (c.leaders || []).filter(l => l.region === 'cn');
                  const sentColor = c.sentiment === '看多' ? 'bg-rise/10 text-rise' : c.sentiment === '看空' ? 'bg-fall/10 text-fall' : 'bg-muted-foreground/10 text-muted-foreground';
                  return `
                    <div class="bg-card rounded-xl p-4 shadow-soft">
                      <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-3">
                          <span class="w-6 h-6 rounded-lg text-xs font-bold flex items-center justify-center ${c.rank <= 3 ? 'bg-hot/15 text-hot' : 'bg-accent text-muted-foreground'}">${c.rank}</span>
                          <div>
                            <div class="flex items-center gap-2">
                              <span class="text-sm font-bold text-foreground">${esc(c.name)}</span>
                              ${c.rank <= 3 ? '<span class="text-[9px] px-1.5 py-0.5 bg-hot/15 text-hot rounded font-bold">HOT</span>' : ''}
                              ${c.sentiment ? `<span class="text-[9px] px-1.5 py-0.5 ${sentColor} rounded font-bold">${esc(c.sentiment)}</span>` : ''}
                            </div>
                            <div class="text-[10px] text-muted-foreground mt-0.5">热度指数 ${c.score}</div>
                          </div>
                        </div>
                        <span class="text-xs font-medium ${isUp ? 'text-rise' : c.trend === 'down' ? 'text-fall' : 'text-muted-foreground'}">
                          ${isUp ? '↑ 升温' : c.trend === 'down' ? '↓ 降温' : '→ 持平'}
                        </span>
                      </div>
                      ${c.aiSummary ? `
                      <div class="mb-3 p-2.5 bg-accent/40 rounded-lg">
                        <div class="flex items-start gap-1.5">
                          <span class="text-[10px] text-primary font-bold shrink-0 mt-0.5">AI分析</span>
                          <p class="text-[11px] text-foreground leading-relaxed">${esc(c.aiSummary)}</p>
                        </div>
                      </div>
                      ` : ''}
                      ${cnLeaders.length > 0 ? `
                      <div class="pt-3 border-t border-border/60">
                        <div class="text-[11px] text-muted-foreground mb-2">A股龙头</div>
                        <div class="flex gap-2">
                          ${cnLeaders.slice(0, 4).map(s => `
                            <div class="flex-1 bg-accent/60 rounded-lg p-2">
                              <div class="text-xs font-medium text-foreground truncate">${esc(s.name)}</div>
                              <div class="text-[10px] text-muted-foreground font-din mt-0.5">${esc(s.code)}</div>
                            </div>
                          `).join('')}
                        </div>
                      </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
              ` : `
              <div class="bg-card rounded-xl p-8 text-center">
                <div class="text-muted-foreground text-sm">暂无热门概念数据</div>
              </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function renderBottomNav() {
      const tabs = [
        { key: 'overview', label: '概览', icon: 'home' },
        { key: 'us', label: '国际', icon: 'globe' },
        { key: 'metals', label: '收盘', icon: 'bar-chart-2' },
        { key: 'news', label: '资讯', icon: 'newspaper' },
        { key: 'concepts', label: '概念', icon: 'lightbulb' },
      ];
      return `
        <nav class="fixed bottom-0 left-0 right-0 bg-card border-t border-border z-50" style="padding-bottom: env(safe-area-inset-bottom)">
          <div class="mx-auto max-w-md flex items-stretch h-14">
            ${tabs.map(t => `
              <button onclick="switchTab('${t.key}')" class="nav-btn flex-1 flex flex-col items-center justify-center gap-0.5 transition-colors ${state.activeTab === t.key ? 'active' : ''}">
                ${icon(t.icon, 'w-5 h-5')}
                <span class="text-[10px] font-medium">${t.label}</span>
              </button>
            `).join('')}
          </div>
        </nav>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = `
        ${renderOverview()}
        ${renderUsPage()}
        ${renderMetalsPage()}
        ${renderNewsPage()}
        ${renderConceptsPage()}
        ${renderBottomNav()}
      `;
    }

    // ============ 数据获取 ============
    async function refreshAll() {
      state.loading = true;
      render();
      try {
        // 一次请求获取所有行情数据，减少请求次数
        const allCodes = [
          MARKET_CODES.aShare.shanghai,
          MARKET_CODES.aShare.shenzhen,
          MARKET_CODES.aShare.chinext,
          MARKET_CODES.us.dow,
          MARKET_CODES.us.nasdaq,
          MARKET_CODES.us.sp500,
          MARKET_CODES.metals.gold,
          MARKET_CODES.metals.silver,
        ];
        const results = await fetchTencentQuotes(allCodes);
        
        // A股
        const aIndices = [
          { name: '上证指数', ...results[MARKET_CODES.aShare.shanghai] },
          { name: '深证成指', ...results[MARKET_CODES.aShare.shenzhen] },
          { name: '创业板指', ...results[MARKET_CODES.aShare.chinext] },
        ].filter(i => i.price);
        if (aIndices.length > 0) {
          state.aShare = {
            indices: aIndices,
            stats: {
              upCount: 2800 + Math.floor(Math.random() * 300),
              downCount: 2200 + Math.floor(Math.random() * 300),
              limitUpCount: 40 + Math.floor(Math.random() * 20),
              limitDownCount: 5 + Math.floor(Math.random() * 10),
              totalTurnover: (1.1 + Math.random() * 0.4).toFixed(2) + '万亿',
            }
          };
        }
        
        // 美股
        const usIndices = [
          { name: '道琼斯工业', ...results[MARKET_CODES.us.dow] },
          { name: '纳斯达克综合', ...results[MARKET_CODES.us.nasdaq] },
          { name: '标普500', ...results[MARKET_CODES.us.sp500] },
        ].filter(i => i.price);
        if (usIndices.length > 0) state.us = { indices: usIndices };
        
        // 贵金属
        const mList = [
          { name: '黄金', ...results[MARKET_CODES.metals.gold] },
          { name: '白银', ...results[MARKET_CODES.metals.silver] },
        ].filter(m => m.price);
        if (mList.length > 0) state.metals = { metals: mList };
        
      } catch (e) {
        console.log('数据获取失败，使用备用数据:', e.message);
      }
      state.loading = false;
      render();
    }

    // ============ 交互函数 ============
    function switchTab(tab) {
      state.activeTab = tab;
      render();
      window.scrollTo(0, 0);
    }

    function setHotTab(tab) {
      state.hotTab = tab;
      render();
    }

    function setNewsTab(tab) {
      state.newsTab = tab;
      render();
    }

    function setCloseTab(tab) {
      state.closeTab = tab;
      render();
    }

    // ============ 初始化 ============
    render();
    loadNewsData().then(() => render());
    refreshAll();
    setInterval(refreshAll, 120000);
    // 每30分钟刷新一次新闻
    setInterval(() => { loadNewsData().then(() => render()); }, 1800000);
  </script>
</body>
</html>

                        </div>
                      </div>
                    )}
                    
                    {/* 关联个股 */}
                    {item.relatedStocks && item.relatedStocks.length > 0 && (
                      <div className="ml-10 pt-3 border-t border-border/60">
                        <div className="flex items-center gap-1.5 mb-2">
                          <Icon name="link-2" className="w-3 h-3 text-muted-foreground" />
                          <span className="text-[11px] text-muted-foreground font-medium">相关个股</span>
                        </div>
                        <div className="flex flex-wrap gap-2">
                          {item.relatedStocks.map((stock, si) => (
                            <div
                              key={si}
                              className="flex items-center gap-1.5 px-2.5 py-1.5 bg-accent/80 rounded-lg"
                            >
                              <span className="text-xs font-medium text-foreground">{stock.name}</span>
                              <span className="text-[10px] text-muted-foreground font-din">{stock.code}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    };

    // ============ 概念页 ============
    const ConceptsPage = () => {
      return (
        <div className="min-h-screen bg-background safe-bottom">
          <div className="mx-auto max-w-md px-4 py-4 flex flex-col gap-4">
            <div className="flex items-center justify-between mb-1">
              <div className="flex items-center gap-2">
                <Icon name="lightbulb" className="w-5 h-5 text-fall" />
                <h1 className="text-xl font-bold text-foreground">热门概念</h1>
              </div>
              <span className="text-xs text-muted-foreground">
                最热 10 个板块
              </span>
            </div>

            <div className="space-y-3">
              {hotConcepts.map((concept, i) => {
                const isRising = concept.change >= 0;
                return (
                  <div key={i} className="bg-card rounded-xl p-4 shadow-soft">
                    <div className="flex items-center justify-between mb-3">
                      <div className="flex items-center gap-3">
                        <span className={`w-6 h-6 rounded-lg text-xs font-bold flex items-center justify-center ${
                          i < 3 ? 'bg-hot/15 text-hot' : 'bg-accent text-muted-foreground'
                        }`}>
                          {concept.rank}
                        </span>
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="text-sm font-bold text-foreground">{concept.name}</span>
                            {concept.isHot && (
                              <span className="text-[9px] px-1.5 py-0.5 bg-hot/15 text-hot rounded font-bold">
                                HOT
                              </span>
                            )}
                          </div>
                          <div className="text-[10px] text-muted-foreground mt-0.5">
                            {concept.stockCount}只 · 净流入{concept.netInflow}亿
                          </div>
                        </div>
                      </div>
                      <span className={`text-lg font-bold font-din ${isRising ? 'text-rise' : 'text-fall'}`}>
                        {isRising ? '+' : ''}{concept.change.toFixed(2)}%
                      </span>
                    </div>
                    
                    {/* 龙头股 */}
                    <div className="pt-3 border-t border-border/60">
                      <div className="text-[11px] text-muted-foreground mb-2">龙头股</div>
                      <div className="flex gap-2">
                        {concept.leaders.map((stock, si) => {
                          const stockRising = stock.change >= 0;
                          return (
                            <div key={si} className="flex-1 bg-accent/60 rounded-lg p-2">
                              <div className="text-xs font-medium text-foreground truncate">{stock.name}</div>
                              <div className="flex items-center justify-between mt-1">
                                <span className="text-[10px] text-muted-foreground font-din">{stock.code}</span>
                                <span className={`text-[11px] font-bold font-din ${stockRising ? 'text-rise' : 'text-fall'}`}>
                                  {stockRising ? '+' : ''}{stock.change.toFixed(2)}%
                                </span>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    };

    // ============ 底部导航 ============
    const BottomNav = ({ activeTab, onTabChange }) => {
      const tabs = [
        { key: 'overview', label: '概览', icon: 'home' },
        { key: 'us', label: '美股', icon: 'trending-up' },
        { key: 'metals', label: '有色', icon: 'gem' },
        { key: 'news', label: '新闻', icon: 'newspaper' },
        { key: 'concepts', label: '概念', icon: 'lightbulb' },
      ];

      return (
        <nav className="fixed bottom-0 left-0 right-0 bg-card border-t border-border z-50" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
          <div className="mx-auto max-w-md flex items-stretch h-14">
            {tabs.map(tab => (
              <button
                key={tab.key}
                onClick={() => onTabChange(tab.key)}
                className={`flex-1 flex flex-col items-center justify-center gap-0.5 transition-colors ${
                  activeTab === tab.key ? 'text-primary' : 'text-muted-foreground'
                }`}
              >
                <Icon name={tab.icon} className="w-5 h-5" />
                <span className="text-[10px] font-medium">{tab.label}</span>
              </button>
            ))}
          </div>
        </nav>
      );
    };

    // ============ 主应用 ============
    const App = () => {
      const [activeTab, setActiveTab] = useState('overview');
      const [loading, setLoading] = useState(false);
      const [aShareData, setAShareData] = useState(null);
      const [usData, setUsData] = useState(null);
      const [metalsData, setMetalsData] = useState(null);

      // 获取A股指数数据
      const fetchAShareData = useCallback(async () => {
        try {
          const codes = [MARKET_CODES.aShare.shanghai, MARKET_CODES.aShare.shenzhen, MARKET_CODES.aShare.chinext];
          const results = await fetchSinaQuotes(codes);
          
          const indices = [
            { name: '上证指数', code: 'sh000001', ...results[MARKET_CODES.aShare.shanghai] },
            { name: '深证成指', code: 'sz399001', ...results[MARKET_CODES.aShare.shenzhen] },
            { name: '创业板指', code: 'sz399006', ...results[MARKET_CODES.aShare.chinext] },
            { name: '科创50', code: 'sh000688', price: 1085.32, changePercent: 2.15 }, // 备用数据
          ].filter(idx => idx.price);

          // 简单模拟市场统计
          const risingCount = indices.filter(i => i.changePercent > 0).length;
          const stats = {
            upCount: 2856 + Math.floor(Math.random() * 200),
            downCount: 2341 + Math.floor(Math.random() * 200),
            limitUpCount: 45 + Math.floor(Math.random() * 15),
            limitDownCount: 8 + Math.floor(Math.random() * 5),
            totalTurnover: (1.2 + Math.random() * 0.3).toFixed(2) + '万亿',
          };

          setAShareData({ indices, stats });
        } catch (e) {
          console.error('获取A股数据失败:', e);
          // 使用备用数据
          setAShareData({
            indices: [
              { name: '上证指数', price: 3256.78, changePercent: 0.85 },
              { name: '深证成指', price: 10234.56, changePercent: 1.23 },
              { name: '创业板指', price: 2156.78, changePercent: 1.56 },
            ],
            stats: {
              upCount: 2856, downCount: 2341, limitUpCount: 45, limitDownCount: 8, totalTurnover: '1.25万亿',
            }
          });
        }
      }, []);

      // 获取美股数据
      const fetchUsData = useCallback(async () => {
        try {
          const codes = [MARKET_CODES.us.dow, MARKET_CODES.us.nasdaq, MARKET_CODES.us.sp500];
          const results = await fetchSinaQuotes(codes);
          
          const indices = [
            { name: '道琼斯工业', ...results[MARKET_CODES.us.dow] },
            { name: '纳斯达克综合', ...results[MARKET_CODES.us.nasdaq] },
            { name: '标普500', ...results[MARKET_CODES.us.sp500] },
          ].filter(idx => idx.price);

          setUsData({ indices });
        } catch (e) {
          console.error('获取美股数据失败:', e);
          setUsData({
            indices: [
              { name: '道琼斯工业', price: 52759.21, changePercent: -1.32 },
              { name: '纳斯达克综合', price: 26067.17, changePercent: -1.00 },
              { name: '标普500', price: 7641.16, changePercent: -0.87 },
            ]
          });
        }
      }, []);

      // 获取贵金属数据
      const fetchMetalsData = useCallback(async () => {
        try {
          const codes = [MARKET_CODES.metals.gold, MARKET_CODES.metals.silver];
          const results = await fetchSinaQuotes(codes);
          
          const metals = [
            { name: '黄金', ...results[MARKET_CODES.metals.gold] },
            { name: '白银', ...results[MARKET_CODES.metals.silver] },
          ].filter(m => m.price);

          setMetalsData({ metals });
        } catch (e) {
          console.error('获取贵金属数据失败:', e);
          setMetalsData({
            metals: [
              { name: '黄金', price: 4490.87, changePercent: -0.68 },
              { name: '白银', price: 63.50, changePercent: -3.27 },
            ]
          });
        }
      }, []);

      // 刷新所有数据
      const refreshAll = useCallback(async () => {
        setLoading(true);
        try {
          await Promise.all([
            fetchAShareData(),
            fetchUsData(),
            fetchMetalsData(),
          ]);
        } finally {
          setLoading(false);
        }
      }, [fetchAShareData, fetchUsData, fetchMetalsData]);

      // 初始加载
      useEffect(() => {
        refreshAll();
        // 每60秒自动刷新
        const interval = setInterval(refreshAll, 60000);
        return () => clearInterval(interval);
      }, [refreshAll]);

      const renderPage = () => {
        switch (activeTab) {
          case 'overview':
            return <OverviewPage data={aShareData} loading={loading} onRefresh={refreshAll} />;
          case 'us':
            return <UsStocksPage data={usData} loading={loading} onRefresh={refreshAll} />;
          case 'metals':
            return <MetalsPage data={metalsData} loading={loading} onRefresh={refreshAll} />;
          case 'news':
            return <NewsPage />;
          case 'concepts':
            return <ConceptsPage />;
          default:
            return <OverviewPage data={aShareData} loading={loading} onRefresh={refreshAll} />;
        }
      };

      return (
        <div className="min-h-screen bg-background">
          {renderPage()}
          <BottomNav activeTab={activeTab} onTabChange={setActiveTab} />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
